<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <style>
    .box        { fill: #f4f6f8; stroke: #556; stroke-width: 1.4; }
    .cluster    { fill: #f8f7fb; stroke: #556; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .box-inner  { fill: #ffffff; stroke: #556; stroke-width: 1.2; }
    .label        { font-size: 14px; fill: #1a1a1a; text-anchor: middle; }
    .inner-label  { font-size: 13px; fill: #1a1a1a; text-anchor: middle; }
    .sub          { font-size: 10.5px; fill: #555; text-anchor: middle; }
    .cluster-label{ font-size: 12px; fill: #555; text-anchor: middle; font-style: italic; }
    .edge       { stroke: #556; stroke-width: 1.4; fill: none; marker-end: url(#arrow); marker-start: url(#arrow); }
    .edge-1way  { stroke: #556; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    .edge-dash-1way { stroke: #556; stroke-width: 1.4; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow); }
    .edge-dash  { stroke: #556; stroke-width: 1.4; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow); marker-start: url(#arrow); }
    .et  { font-size: 11px; fill: #444; text-anchor: middle; }
  </style>

  <rect width="1060" height="600" fill="#fcfcfb"/>

  <!-- Client -->
  <rect class="box" x="430" y="20" width="160" height="44" rx="6"/>
  <text class="label" x="510" y="47">Browser</text>

  <!-- nginx -->
  <rect class="box" x="430" y="110" width="160" height="44" rx="6"/>
  <text class="label" x="510" y="137">nginx</text>

  <!-- React frontend -->
  <rect class="box" x="24" y="218" width="165" height="52" rx="6"/>
  <text class="label" x="106" y="241">React frontend</text>
  <text class="sub"   x="106" y="259">lib-jitsi-meet, Excalidraw</text>

  <!-- Excalidraw -->
  <rect class="box" x="212" y="218" width="130" height="52" rx="6"/>
  <text class="label" x="277" y="249">Excalidraw</text>

  <!-- Node backend -->
  <rect class="box" x="350" y="218" width="150" height="52" rx="6"/>
  <text class="label" x="425" y="241">Node.js backend</text>
  <text class="sub"   x="425" y="259">Express, Socket.IO</text>

  <!-- Go signaling -->
  <rect class="box" x="520" y="218" width="96" height="52" rx="6"/>
  <text class="label" x="568" y="241">gosignal</text>
  <text class="sub"   x="568" y="259">Go, 1:1 calls</text>

  <!-- MongoDB -->
  <rect class="box" x="340" y="340" width="110" height="44" rx="6"/>
  <text class="label" x="395" y="367">MongoDB</text>

  <!-- Redis -->
  <rect class="box" x="475" y="340" width="130" height="44" rx="6"/>
  <text class="label" x="540" y="367">Redis</text>

  <!-- Transcriber -->
  <rect class="box" x="330" y="470" width="200" height="52" rx="6"/>
  <text class="label" x="430" y="493">Call transcriber</text>
  <text class="sub"   x="430" y="511">Go, speech-to-text via Deepgram</text>

  <!-- Jitsi cluster -->
  <rect class="cluster" x="622" y="168" width="392" height="404" rx="10"/>
  <text class="cluster-label" x="818" y="188">Jitsi</text>

  <!-- Jitsi Meet -->
  <rect class="box-inner" x="668" y="200" width="300" height="40" rx="5"/>
  <text class="inner-label" x="818" y="225">Jitsi Meet</text>

  <!-- Prosody -->
  <rect class="box-inner" x="668" y="286" width="300" height="46" rx="5"/>
  <text class="inner-label" x="818" y="306">Prosody</text>
  <text class="sub"         x="818" y="322">XMPP server</text>

  <!-- Jicofo -->
  <rect class="box-inner" x="648" y="392" width="150" height="42" rx="5"/>
  <text class="inner-label" x="723" y="418">Jicofo</text>

  <!-- Jibri -->
  <rect class="box-inner" x="840" y="392" width="128" height="42" rx="5"/>
  <text class="inner-label" x="904" y="418">Jibri</text>

  <!-- JVB -->
  <rect class="box-inner" x="668" y="486" width="300" height="46" rx="5"/>
  <text class="inner-label" x="818" y="506">JVB (videobridge)</text>
  <text class="sub"         x="818" y="522">SFU / media router</text>

  <!-- internal Jitsi wiring -->
  <path class="edge" d="M 818 240 L 818 286"/>
  <text class="et" x="826" y="267" style="text-anchor: start">Websocket / Bosh</text>

  <!-- Jicofo <-> Prosody -->
  <path class="edge" d="M 700 392 L 714 332"/>
  <text class="et" x="694" y="360" style="text-anchor: end">setup</text>
  <text class="et" x="694" y="372" style="text-anchor: end">connections</text>
  <path class="edge" d="M 735 392 L 747 332"/>
  <text class="et" x="772" y="360">presence</text>

  <!-- JVB <-> Prosody -->
  <path class="edge" d="M 812 486 L 812 332"/>
  <text class="et" x="840" y="468">statistics</text>

  <!-- Jibri <-> Prosody: brewery MUC -->
  <path class="edge" d="M 950 392 C 958 368, 962 348, 963 332"/>
  <text class="et" x="930" y="362">availability</text>

  <!-- Jibri <- JVB: receives conference media to record/stream -->
  <path class="edge-dash-1way" d="M 916 486 L 916 434"/>
  <text class="et" x="926" y="464" style="text-anchor: start">streaming</text>

  <!-- JVB -> transcriber: conference audio -->
  <path class="edge-dash-1way" d="M 668 500 L 530 500"/>
  <text class="et" x="598" y="492">audio</text>

  <!-- transcriber -> Mongo -->
  <path class="edge-1way" d="M 395 470 L 395 384"/>
  <text class="et" x="430" y="430">transcripts</text>

  <!-- Client -> nginx -->
  <path class="edge" d="M 510 64 L 510 110"/>
  <text class="et" x="551" y="91">HTTPS / WSS</text>

  <!-- nginx -> frontend / excalidraw / backend -->
  <path class="edge" d="M 445 154 C 320 182, 175 190, 106 218"/>
  <text class="et" x="238" y="182">HTTP (SPA)</text>
  <path class="edge" d="M 478 154 C 400 180, 320 198, 285 218"/>
  <text class="et" x="285" y="206">HTTP + WS</text>
  <path class="edge" d="M 505 154 C 490 175, 460 198, 440 218"/>
  <text class="et" x="516" y="186">HTTP + WS</text>

  <!-- nginx -> gosignal -->
  <path class="edge" d="M 540 154 C 552 175, 562 198, 568 218"/>
  <text class="et" x="573" y="206" style="text-anchor: start">WS</text>

  <!-- nginx -> Jitsi Meet -->
  <path class="edge" d="M 566 150 C 650 172, 710 182, 770 200"/>
  <text class="et" x="650" y="158">group-call</text>

  <!-- backend -> Mongo / Redis -->
  <path class="edge" d="M 410 270 L 397 340"/>
  <text class="et" x="392" y="308" style="text-anchor: end">queries</text>
  <path class="edge" d="M 470 270 L 510 340"/>
  <text class="et" x="506" y="304" style="text-anchor: start">scale-out: sessions,</text>
  <text class="et" x="506" y="316" style="text-anchor: start">Socket.IO adapter</text>

  <!-- Client <-> JVB -->
  <path class="edge-dash" d="M 590 42 C 1030 54, 1036 470, 968 505"/>
  <text class="et" x="656" y="70">media (SRTP)</text>
</svg>
